name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: felixgilioli/fastfood-service

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            felixgilioli/fastfood-service:latest
            felixgilioli/fastfood-service:v${{ github.run_number }}

  push-docker-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            felixgilioli/fastfood-service:latest
            felixgilioli/fastfood-service:v${{ github.run_number }}
          load: true

  deploy-kubernetes:
    runs-on: ubuntu-latest
    needs: [ push-docker-image ]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configuração das AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configuração do Kubectl
        run: aws eks update-kubeconfig --name pipeline-elite

      - name: Instalar Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Substituir placeholder no secret
        env:
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
        run: |
          cd k8s
          # Substituir o placeholder pelo valor real
          sed -i "s/PLACEHOLDER_TOKEN/${MERCADO_PAGO_ACCESS_TOKEN}/g" secret-patch.yaml

      - name: Deploy no Kubernetes com Kustomize
        env:
          IMAGE_TAG: v${{ github.run_number }}
        run: |
          cd k8s
          kustomize edit set image felixgilioli/fastfood-service=felixgilioli/fastfood-service:${IMAGE_TAG}
          kustomize build . | kubectl apply -f -

      - name: Verificar deployment
        run: |
          kubectl rollout status deployment/fastfood-service-deployment -n tcc
          kubectl get pods -n tcc