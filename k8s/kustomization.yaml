apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

secretGenerator:
  - name: fastfood-service-secret
    literals:
      - MERCADO_PAGO_ACCESS_TOKEN=$(MERCADO_PAGO_ACCESS_TOKEN)

images:
  - name: felixgilioli/fastfood-service
    newTag: latest