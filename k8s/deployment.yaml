apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastfood-service-deployment
  namespace: tcc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastfood-service
  template:
    metadata:
      labels:
        app: fastfood-service
    spec:
      containers:
        - name: fastfood-service
          image: felixgilioli/fastfood-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: MERCADO_PAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fastfood-service-secret
                  key: MERCADO_PAGO_ACCESS_TOKEN
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: fastfood-service-secret
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: fastfood-service-secret
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: fastfood-service-secret
                  key: DB_PASS
          resources:
            requests:
              memory: "400Mi"
              cpu: "125m"
            limits:
              memory: "600Mi"
              cpu: "400m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5